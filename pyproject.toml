[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gdrivecopy"
dynamic = ["version"]
description = "Fast, resilient copies between local folders and Google Drive"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["google-drive", "backup", "cli", "file-transfer", "resumable"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Archiving :: Backup",
]
requires-python = ">=3.10"
dependencies = [
    "google-api-python-client>=2.100.0",
    "google-auth-oauthlib>=1.2.0",
    "google-auth>=2.25.0",
    "requests>=2.31.0",
    "httplib2>=0.22.0",
    "rich>=13.9.0",
    "certifi>=2023.7.22",
    "urllib3>=1.26.0",
]

[project.optional-dependencies]
build = ["build>=1.2.0", "pyinstaller>=6.22.0,<7"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.12.0",
]

[project.urls]
Homepage = "https://github.com/sytelus/gdrivecopy"
Documentation = "https://github.com/sytelus/gdrivecopy/blob/main/USAGE.md"
Issues = "https://github.com/sytelus/gdrivecopy/issues"
Changelog = "https://github.com/sytelus/gdrivecopy/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["gdrivecopy*"]

[project.scripts]
gdrivecopy = "gdrivecopy.cli:main"

[tool.setuptools.dynamic]
version = {attr = "gdrivecopy.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-v", "--tb=short"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM", "RUF"]
